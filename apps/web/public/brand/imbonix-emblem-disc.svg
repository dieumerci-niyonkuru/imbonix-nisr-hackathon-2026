<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="IMBONIX emblem"><circle cx="256" cy="256" r="256" fill="#FFFFFF"/><g transform="translate(24 24) scale(0.90625)">
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0060B4"/>
      <stop offset="0.55" stop-color="#0090E4"/>
      <stop offset="1" stop-color="#00C0D8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0060B4"/>
      <stop offset="1" stop-color="#0090E4"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0090E4"/>
      <stop offset="1" stop-color="#00C0D8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0B3D82"/>
      <stop offset="1" stop-color="#002454"/>
    </linearGradient>
  </defs>

  <!-- Open ring, with the short cyan arc on the right -->
  <path d="M 30 300 A 228 228 0 0 1 334 42" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round"/>
  <path d="M 392 72 A 228 228 0 0 1 448 132" fill="none" stroke="#00C0D8" stroke-width="15" stroke-linecap="round"/>

  <!-- Rising bars -->
  <rect x="131" y="222" width="58" height="150" rx="10" fill="url(#bar)"/>
  <rect x="214" y="170" width="60" height="200" rx="10" fill="url(#bar)"/>
  <rect x="300" y="104" width="62" height="270" rx="10" fill="url(#bar3)"/>

  <!-- Gold sun rising behind two hills -->
  <g stroke="#F8B828" stroke-width="9" stroke-linecap="round">
    <line x1="396" y1="200" x2="381" y2="190"/>
    <line x1="409" y1="185" x2="401" y2="168"/>
    <line x1="428" y1="179" x2="428" y2="160"/>
    <line x1="447" y1="185" x2="456" y2="168"/>
    <line x1="460" y1="200" x2="476" y2="191"/>
  </g>
  <path d="M 392 318 L 392 262 C 410 238 426 222 440 224 C 458 236 474 258 486 288 L 486 318 Z" fill="#0090E4"/>
  <path d="M 370 322 L 370 286 C 392 260 408 250 424 254 C 446 262 466 280 484 302 L 484 322 Z" fill="#0060B4"/>

  <!-- Clearing behind the people -->
  <circle cx="241" cy="362" r="106" fill="#FFFFFF"/>

  <!-- Trend line and its nodes -->
  <polyline points="100,207 223,137 357,57" fill="none" stroke="#0060B4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="207" r="19" fill="#004E96"/>
  <circle cx="223" cy="137" r="19" fill="#0060B4"/>
  <circle cx="357" cy="57" r="21" fill="#0078C8"/>

  <!-- Two people -->
  <circle cx="200" cy="318" r="25" fill="#0060B4"/>
  <circle cx="282" cy="322" r="23" fill="#004E96"/>
  <path d="M 156 440 L 156 392 C 156 360 176 350 200 350 C 224 350 244 360 244 392 L 244 486 Z" fill="#0060B4"/>
  <path d="M 240 486 L 240 394 C 240 364 260 354 282 354 C 304 354 324 364 324 394 L 324 440 Z" fill="#004E96"/>

  <!-- Two leaves cupping them, edged in white so they sit in front -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" paint-order="stroke">
    <path d="M 18 300 C 72 310 140 334 192 384 C 222 414 242 448 250 490 C 154 482 62 422 18 300 Z" fill="url(#leaf)"/>
    <path d="M 494 292 C 440 306 374 330 322 380 C 292 410 272 448 264 490 C 360 482 452 416 494 292 Z" fill="url(#leaf)"/>
  </g>
</g></svg>
