    <path d="M 18 300 C 72 310 140 334 192 384 C 222 414 242 448 250 490 C 154 482 62 422 18 300 Z" fill="url(#leaf)"/>
    <path d="M 494 292 C 440 306 374 330 322 380 C 292 410 272 448 264 490 C 360 482 452 416 494 292 Z" fill="url(#leaf)"/>
  </g>
