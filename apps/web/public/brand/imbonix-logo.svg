<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 563" role="img" aria-label="IMBONIX: Data for Inclusive Prosperity"><svg x="90.0" y="10.0" width="380.0" height="380.0" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0060B4"/>
      <stop offset="0.55" stop-color="#0090E4"/>
      <stop offset="1" stop-color="#00C0D8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0060B4"/>
      <stop offset="1" stop-color="#0090E4"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0090E4"/>
      <stop offset="1" stop-color="#00C0D8"/>
    </linearGradient>
