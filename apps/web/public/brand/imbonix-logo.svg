  <path d="M 370 322 L 370 286 C 392 260 408 250 424 254 C 446 262 466 280 484 302 L 484 322 Z" fill="#0060B4"/>

  <!-- Clearing behind the people -->
  <circle cx="241" cy="362" r="106" fill="#FFFFFF"/>

  <!-- Trend line and its nodes -->
  <polyline points="100,207 223,137 357,57" fill="none" stroke="#0060B4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="207" r="19" fill="#004E96"/>
  <circle cx="223" cy="137" r="19" fill="#0060B4"/>
  <circle cx="357" cy="57" r="21" fill="#0078C8"/>

  <!-- Two people -->
  <circle cx="200" cy="318" r="25" fill="#0060B4"/>
  <circle cx="282" cy="322" r="23" fill="#004E96"/>
  <path d="M 156 440 L 156 392 C 156 360 176 350 200 350 C 224 350 244 360 244 392 L 244 486 Z" fill="#0060B4"/>
  <path d="M 240 486 L 240 394 C 240 364 260 354 282 354 C 304 354 324 364 324 394 L 324 440 Z" fill="#004E96"/>

  <!-- Two leaves cupping them, edged in white so they sit in front -->
