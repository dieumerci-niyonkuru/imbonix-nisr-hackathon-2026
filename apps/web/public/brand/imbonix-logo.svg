  <rect x="214" y="170" width="60" height="200" rx="10" fill="url(#bar)"/>
  <rect x="300" y="104" width="62" height="270" rx="10" fill="url(#bar3)"/>

  <!-- Gold sun rising behind two hills -->
  <g stroke="#F8B828" stroke-width="9" stroke-linecap="round">
    <line x1="396" y1="200" x2="381" y2="190"/>
    <line x1="409" y1="185" x2="401" y2="168"/>
    <line x1="428" y1="179" x2="428" y2="160"/>
    <line x1="447" y1="185" x2="456" y2="168"/>
    <line x1="460" y1="200" x2="476" y2="191"/>
